project:
  type: website
  output-dir: _site
  resources:
    - notes/pdf/
    - cv/*.pdf
    - CNAME
    # The footer links to both of these, and neither is a Quarto page, so
    # they must be copied explicitly or the links 404. The OFL entry is also
    # an obligation in its own right: the licence has to ship with the fonts,
    # which are served to every visitor.
    - LICENSE
    - assets/fonts/OFL.txt

website:
  title: "Patrick Oare"
  site-url: "https://www.patrickoare.phd"
  search: true
  # The PNG is the universally-supported fallback and is declared first;
  # the SVG below overrides it wherever SVG favicons are supported.
  # Regenerate both with `python scripts/make_favicon.py` if the source
  # artwork at assets/lqcd_icon.pdf changes.
  favicon: assets/favicon.png
  navbar:
    # Quarto defaults to collapse-below: lg, i.e. the tabs fold into a
    # hamburger below 992px -- far wider than they need. Measured: the brand
    # is 163px and the five tabs end at 504px, so they fit to ~576px, which
    # is exactly the `sm` breakpoint. At `sm` the tabs stay visible on every
    # window except phone-portrait.
    #
    # THIS IS SIZED FOR EXACTLY FIVE TABS. Each tab costs roughly 65px, so a
    # sixth leaves only ~7px of slack at 576px and a seventh overflows into a
    # broken navbar -- a worse failure than a hamburger. If you add a tab,
    # change this to `md` at the same time.
    collapse-below: sm
    left:
      - text: "About"
        href: about.md
      - text: "CV"
        href: cv/index.md
      - text: "Notes"
        href: notes/index.md
      - text: "Blog"
        href: blog/index.md
      - text: "Contact"
        href: contact.md
  # A licence nobody can find protects nothing, so the terms go on every page.
  # Unlike navbar hrefs, Quarto does NOT rewrite plain relative links inside
  # page-footer markdown per page depth (verified: href="LICENSE" rendered
  # identically, and thus wrongly, on both index.html and a nested notes
  # page). Root-relative hrefs (leading "/") DO get rewritten on the way out
  # -- the same trick already used for the favicon SVG link above -- so both
  # links here are written root-relative to resolve from every depth.
  page-footer:
    center: |
      &copy; 2026 Patrick Oare &middot;
      prose and notes under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) &middot;
      code under [MIT](/LICENSE) &middot;
      typeset in Computer Modern Unicode ([OFL](/assets/fonts/OFL.txt))

execute:
  freeze: auto

format:
  html:
    theme: theme.scss
    # Quarto's `favicon:` key emits exactly one <link>, so the SVG is added
    # here. It comes after the PNG link in the head, and carries an explicit
    # type, so browsers that understand SVG favicons choose it and the rest
    # fall back to the PNG. Written root-relative, but Quarto rewrites it per
    # page depth on the way out (./assets/... at the root, ../../assets/...
    # inside a notes topic), so it resolves correctly everywhere.
    include-in-header:
      - text: |
          <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    toc: false
    html-math-method:
      method: katex
      url: "https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/"
